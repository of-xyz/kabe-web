<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabe</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.7;
    color: #1a1a1a;
    background: #ffffff;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 64px 24px 96px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .tagline { color: #666; margin: 0 0 40px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0; }
  li a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 4px; text-decoration: none; color: inherit;
    border-bottom: 1px solid rgba(127,127,127,0.2);
  }
  li a .arrow { color: #999; }
  li.soon span:first-child { color: #999; }
  li.soon .badge { font-size: 0.8rem; color: #999; border: 1px solid rgba(127,127,127,0.35); border-radius: 999px; padding: 2px 10px; }
  a.link { color: #0a67d0; }
  footer { margin-top: 48px; color: #666; font-size: 0.9rem; }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #121212; }
    .tagline, footer { color: #9a9a9a; }
    a.link { color: #5aa9ff; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kabe</h1>
  <p class="tagline">iPad 常設ダッシュボードアプリ</p>

  <ul>
    <li>
      <a href="privacy/">
        <span>プライバシーポリシー / Privacy Policy</span>
        <span class="arrow">→</span>
      </a>
    </li>
    <li>
      <a href="terms/">
        <span>利用規約 / Terms of Service</span>
        <span class="arrow">→</span>
      </a>
    </li>
    <li>
      <a href="contact/">
        <span>お問い合わせ / Contact</span>
        <span class="arrow">→</span>
      </a>
    </li>
  </ul>

  <footer>© 2026 hotori · Kabe</footer>
</div>
</body>
</html>
